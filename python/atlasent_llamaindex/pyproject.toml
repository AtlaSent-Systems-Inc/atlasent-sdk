[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasent-llamaindex"
version = "1.5.1"
description = "AtlaSent authorization wrapper for LlamaIndex tools — authorize every tool call before execution"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "AtlaSent Systems Inc.", email = "sdk@atlasent.io" },
]
keywords = ["atlasent", "llamaindex", "llama-index", "authorization", "middleware", "agent-security", "guardrails", "ai-agent-gating", "llm-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
# atlasent is a real runtime import (guard.py imports
# atlasent.exceptions.AtlaSentDeniedError), not merely a dev/test
# dependency. It was previously declared only under the `dev` extra below,
# which meant `pip install atlasent-llamaindex` alone installed a package
# that raised ModuleNotFoundError on import — caught by the smoke-test
# step added in publish-pypi-llamaindex.yml, which installs only the built
# wheel (no dev extras) before importing it.
#
# Floor is >=2.15.0, not >=1.5.0: guard.py's wrapper always passes
# state_snapshot=state_snapshot to client.protect(), and that parameter
# was only added to atlasent in 2.15.0 (see atlasent/CHANGELOG.md's
# "2.15.0 -- state_snapshot field" entry). Below 2.15.0, protect() has no
# such parameter and every guarded call raises TypeError: protect() got
# an unexpected keyword argument 'state_snapshot'. This README already
# documented ">= 2.15.0 peer dependency" (see "## Version" below); the
# installable constraint just hadn't matched it.
dependencies = ["atlasent>=2.15.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/AtlaSent-Systems-Inc/atlasent-sdk"
Repository = "https://github.com/AtlaSent-Systems-Inc/atlasent-sdk"

[tool.setuptools.packages.find]
include = ["atlasent_llamaindex*"]

[tool.setuptools.package-data]
atlasent_llamaindex = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["atlasent_llamaindex"]

[tool.coverage.report]
fail_under = 95
