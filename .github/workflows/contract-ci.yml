name: Contract CI

on:
  push:
    branches: [main]
    paths:
      - "contract/**"
      - "vendor/trust-root/**"
      - "python/atlasent/models.py"
      - "python/atlasent_v2_alpha/atlasent_v2_alpha/types.py"
      - "typescript/src/client.ts"
      - "typescript/src/types.ts"
      - "typescript/packages/v2-alpha/src/client.ts"
      - "typescript/packages/v2-alpha/src/types.ts"
      - ".github/workflows/contract-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "contract/**"
      - "vendor/trust-root/**"
      - "python/atlasent/models.py"
      - "python/atlasent_v2_alpha/atlasent_v2_alpha/types.py"
      - "typescript/src/client.ts"
      - "typescript/src/types.ts"
      - "typescript/packages/v2-alpha/src/client.ts"
      - "typescript/packages/v2-alpha/src/types.ts"
      - ".github/workflows/contract-ci.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install contract tooling + Python SDK
        run: |
          python -m pip install --upgrade pip
          pip install -r contract/requirements.txt
          # The `verify` extra installs `cryptography`, which the trust-root
          # behaviour vectors need. Without it every test_vector_sdk_behaviour
          # case skips and the gate reads green while proving nothing
          # (atlasent-sdk#519); the pytest step below fails on that skip.
          pip install -e "python/[verify]"
          pip install pytest

      - name: Validate vectors against schemas
        run: python contract/tools/validate_vectors.py

      - name: Validate trust-root vectors
        run: python contract/tools/validate_trust_root_vectors.py

      - name: Validate OpenAPI spec (+ schema sync check)
        run: python contract/tools/validate_openapi.py

      - name: Policy lint
        run: python contract/tools/policy_lint.py

      - name: SDK drift detector
        run: python contract/tools/drift.py

      - name: Pytest (contract suite)
        env:
          # Turns test_sdk_behaviour_gate_is_armed into a hard failure if the
          # behaviour vectors would skip (missing cryptography / fixture).
          ATLASENT_CONTRACT_REQUIRE_SDK_BEHAVIOUR: "1"
        run: pytest contract/tests/ -v -rs
