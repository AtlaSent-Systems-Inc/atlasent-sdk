name: Publish @atlasent/enforce to npm

# Triggers only on enforce-v* tags. Tag pattern:
# enforce-vX.Y.Z (e.g. enforce-v1.0.0). Publishes under the
# `latest` dist-tag so `npm install @atlasent/enforce` resolves
# the current GA release.
#
# Disjoint from publish-npm.yml (typescript-v*) and
# publish-npm-v2alpha.yml (typescript-v2-alpha-v*) so a single tag
# push only triggers the right publisher.

on:
  push:
    tags:
      - "enforce-v*"
  workflow_dispatch:
    inputs:
      skip_gate:
        description: 'EMERGENCY ONLY. Bypasses the AtlaSent deploy gate. Requires `reason`. Use only when the gate itself cannot be satisfied (see step comments).'
        type: boolean
        default: false
      reason:
        description: 'Required when skip_gate=true: why the gate is being bypassed. Recorded in the run log and step summary.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]
    defaults:
      run:
        working-directory: typescript/packages/enforce
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/packages/enforce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    needs: test
    environment: npm-enforce
    # id-token: write is required for:
    #   1. `npm publish --provenance` (Sigstore-backed npm provenance).
    #   2. cosign keyless signing (Sigstore Fulcio + Rekor, R4).
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: typescript/packages/enforce
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: typescript/packages/enforce/package-lock.json
          registry-url: "https://registry.npmjs.org"

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes.
      # This was previously gated on `production.deploy`, the wrong
      # protected action for package publication (same release-control
      # inconsistency corrected in publish-npm.yml/publish-pypi.yml —
      # see those files' comments). Corrected here to match, rather than
      # left in a permanently-guaranteed-deny state.
      - name: AtlaSent release gate
        if: ${{ !inputs.skip_gate }}
        uses: AtlaSent-Systems-Inc/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          action: package.release
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          actor: ${{ github.actor }}
          environment: production
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'

      - name: Gate bypass warning
        if: ${{ inputs.skip_gate }}
        run: |
          if [ -z "${{ inputs.reason }}" ]; then
            echo "::error title=skip_gate requires reason::skip_gate=true was set with no reason. Re-dispatch with reason filled in."
            exit 1
          fi
          echo "::warning title=DEPLOY GATE BYPASSED::skip_gate=true — AtlaSent authorization gate was bypassed by ${{ github.actor }}. Reason: ${{ inputs.reason }}."
          echo "## ⚠️ DEPLOY GATE BYPASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Actor:** \`${{ github.actor }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Reason:** ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        # GITHUB_REF is refs/tags/enforce-v<version>. Strip the prefix
        # and compare against package.json "version". Refuses to publish
        # if they disagree.
        # Skipped for workflow_dispatch runs (no tag ref).
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/enforce-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi
          echo "Tag and package version agree: $PKG_VERSION"

      - name: Build
        run: npm run build

      - name: Pack tarball for signing
        run: npm pack

      # ── R4: cosign keyless signing ──────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign npm tarball (keyless, Sigstore Fulcio + Rekor)
        run: |
          TARBALL="$(ls *.tgz | head -1)"
          cosign sign-blob \
            --yes \
            --bundle="${TARBALL}.bundle" \
            "${TARBALL}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Verify signature
        run: |
          cosign verify-blob \
            --bundle="${TARBALL}.bundle" \
            --certificate-identity-regexp='https://github.com/AtlaSent-Systems-Inc/atlasent-sdk/.github/workflows/publish-npm-enforce.yml@refs/tags/enforce-v.*' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            "${TARBALL}"

      - name: Upload signature bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball-cosign-bundle-enforce
          path: typescript/packages/enforce/${{ env.TARBALL }}.bundle
          retention-days: 90

      - name: Inspect tarball contents (dry-run)
        # `npm pack --dry-run` prints the exact file list that would
        # ship to the registry. Logged so a missing `files` entry or
        # accidentally-included secret is visible before publish.
        run: npm pack --dry-run

      - name: Publish (latest dist-tag, with provenance)
        run: npm publish --access public --tag latest --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
